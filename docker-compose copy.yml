version: '3.8'

services:
  # Redis Cache (Optional - for caching and job queue)
  redis:
    image: redis:7-alpine
    container_name: captcha-solver-redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlir-network
    command: redis-server --appendonly yes
    restart: unless-stopped
  
  # NestJS Application
  app:
    image: dlir/captcha-solver:latest
    container_name: captcha-solver-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dlir-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  dlir-network:
    driver: bridge
